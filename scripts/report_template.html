<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notch conformance — ${run_title}</title>
<!-- This file is generated by scripts/build_diagnostics_report.py. The only $
     placeholders are ${run_title}, ${generated_at}, ${data_json} (string.Template
     safe_substitute); all other CSS/JS is literal. Self-contained: no external
     resources, opens via file://. -->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --fg: #e6e6e6; --muted: #9aa4b2;
    --line: #2a2f3a; --pass: #3fb950; --fail: #f85149; --skip: #d29922; --info: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: var(--bg); z-index: 5; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 12px; }
  .banner { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; margin-right: 10px; }
  .banner.pass { background: rgba(63,185,80,.15); color: var(--pass); }
  .banner.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .totals span { margin-right: 12px; color: var(--muted); }
  .totals b { color: var(--fg); }
  main { padding: 16px 22px 64px; max-width: 1100px; }
  input#search { width: 100%; padding: 9px 12px; margin: 6px 0 18px; border: 1px solid var(--line);
                 background: var(--panel); color: var(--fg); border-radius: 8px; font-size: 14px; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 16px; overflow: hidden; }
  .job > h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
              display: flex; align-items: center; gap: 10px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.pass { background: rgba(63,185,80,.15); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .pill.skip { background: rgba(210,153,34,.15); color: var(--skip); }
  .pill.error { background: rgba(248,81,73,.22); color: var(--fail); }
  .job-body { padding: 8px 16px 14px; }
  .meta { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
  .meta code { color: var(--fg); }
  .case { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--panel2); }
  .case > summary { cursor: pointer; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .case > summary::-webkit-details-marker { display: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .dot.pass { background: var(--pass); } .dot.fail { background: var(--fail); }
  .dot.skip { background: var(--skip); } .dot.error { background: var(--fail); }
  .case .cid { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .case .err { color: var(--fail); font-family: ui-monospace, monospace; font-size: 12px; margin-left: auto; }
  .case .detail { padding: 4px 12px 12px; }
  pre { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cdd6e4; }
  details.block { margin: 8px 0; }
  details.block > summary { cursor: pointer; color: var(--info); font-size: 13px; padding: 4px 0; }
  .sev { font-family: ui-monospace, monospace; font-size: 12px; padding: 2px 8px; border-radius: 5px; margin-right: 6px; }
  .sev.WARNING { background: rgba(210,153,34,.16); color: var(--skip); }
  .sev.ERROR { background: rgba(248,81,73,.16); color: var(--fail); }
  .diag { padding: 3px 0; color: var(--muted); font-size: 12px; }
  table.kv { border-collapse: collapse; font-size: 12px; }
  table.kv td { border: 1px solid var(--line); padding: 3px 8px; }
  table.kv td:first-child { color: var(--muted); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-style: italic; }
  a { color: var(--info); }
</style>
</head>
<body>
<header>
  <h1>Notch-Comfy conformance report</h1>
  <div id="head-status"></div>
  <div class="sub">run ${run_title} · generated ${generated_at}</div>
</header>
<main>
  <input id="search" placeholder="Filter cases, error codes, diagnostics, log lines…" autocomplete="off">
  <div id="report"></div>
  <details class="block"><summary>Raw normalized data</summary><pre id="raw-json"></pre></details>
</main>

<script type="application/json" id="diagnostics-data">${data_json}</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("diagnostics-data").textContent);

const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const pretty = (v) => { try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); } };
const order = { fail: 0, error: 1, skip: 2, pass: 3, "": 4 };

function headStatus(run) {
  const s = run.summary || {};
  const host = document.getElementById("head-status");
  host.innerHTML = "";
  const banner = el("span", "banner " + (s.result === "pass" ? "pass" : "fail"), s.result === "pass" ? "PASS" : "FAIL");
  host.appendChild(banner);
  const t = el("span", "totals");
  t.innerHTML = `<span>jobs <b>${s.jobs||0}</b></span><span>pass <b>${s.pass||0}</b></span>` +
                `<span>fail <b>${s.fail||0}</b></span><span>skip <b>${s.skip||0}</b></span><span>error <b>${s.error||0}</b></span>`;
  host.appendChild(t);
}

function envTable(env) {
  const rows = [["platform", env.platform], ["gpu", env.gpu], ["torch", env.torch], ["cuda", env.cuda],
    ["comfyui", (env.comfyui_ref||"") + " " + (env.comfyui_commit||"").slice(0,10)],
    ["extension", (env.extension_commit||"").slice(0,10)]];
  const tbl = el("table", "kv");
  for (const [k, v] of rows) { if (!v) continue; const tr = el("tr"); tr.appendChild(el("td", null, k)); tr.appendChild(el("td", null, String(v))); tbl.appendChild(tr); }
  return tbl;
}

function caseCard(c) {
  const d = el("details", "case");
  d.dataset.search = [c.id, c.title, (c.errors||[]).join(" "), c.phase].join(" ").toLowerCase();
  const sm = el("summary");
  sm.appendChild(el("span", "dot " + (c.result||"")));
  sm.appendChild(el("span", null, c.title || c.id));
  sm.appendChild(el("span", "cid", c.id));
  if (c.errors && c.errors.length) sm.appendChild(el("span", "err", c.errors.join(", ")));
  d.appendChild(sm);
  const body = el("div", "detail");
  if (c.description) body.appendChild(el("div", "meta", c.description));
  if (c.spec_ref) body.appendChild(el("div", "meta", c.spec_ref));
  const ea = el("div");
  ea.innerHTML = "<b>expected</b>"; const pe = el("pre", null, pretty(c.expected)); ea.appendChild(pe);
  ea.innerHTML += "<b>actual</b>"; const pa = el("pre", null, pretty(c.actual)); ea.appendChild(pa);
  body.appendChild(ea);
  // Per-case NOTCH_CI diagnostics: the breadcrumb event trail + any WARNING logs
  // for this prompt. Context, not a verdict (spec §9b).
  const dg = c.diagnostics;
  if (dg && (dg.events?.length || dg.warnings?.length)) {
    const panel = el("details", "block");
    panel.appendChild(el("summary", null, `NOTCH_CI diagnostics (${dg.count} records — context, not pass/fail)`));
    if (dg.events?.length) {
      panel.appendChild(el("div", "meta", "breadcrumb: " + dg.events.join(" → ")));
    }
    for (const w of (dg.warnings || [])) {
      const row = el("div", "diag");
      row.innerHTML = `<span class="sev ${w.severity}">${w.severity}</span>${w.message}`;
      panel.appendChild(row);
    }
    panel.dataset.search = ("notch_ci diagnostics " + (dg.events||[]).join(" ") + " " +
      (dg.warnings||[]).map(w => w.message).join(" ")).toLowerCase();
    body.appendChild(panel);
  }
  if (c.evidence && Object.keys(c.evidence).length) {
    const ev = el("details", "block"); ev.appendChild(el("summary", null, "evidence"));
    ev.appendChild(el("pre", null, pretty(c.evidence)));
    body.appendChild(ev);
  }
  d.appendChild(body);
  if ((c.result === "fail" || c.result === "error")) d.open = true;
  return d;
}

function logBlock(name, log) {
  const det = el("details", "block");
  const label = log.truncated ? `${name} (first ${log.head.length} / last ${log.tail.length} of ${log.total_lines} lines)` : `${name} (${log.total_lines} lines)`;
  det.appendChild(el("summary", null, label));
  const text = log.head.join("\n") + (log.truncated ? "\n  … " + (log.total_lines - log.head.length - log.tail.length) + " lines omitted …\n" + log.tail.join("\n") : "");
  det.appendChild(el("pre", null, text));
  det.dataset.search = (name + " " + log.head.join(" ") + " " + log.tail.join(" ")).toLowerCase();
  return det;
}

function jobSection(job) {
  const sec = el("div", "job");
  const h = el("h2", null, job.label || job.name);
  const t = job.totals || {};
  h.appendChild(el("span", "pill " + (job.result === "pass" ? "pass" : "fail"), job.result === "pass" ? "PASS" : "FAIL"));
  for (const k of ["pass", "fail", "skip", "error"]) if (t[k]) h.appendChild(el("span", "pill " + k, k + " " + t[k]));
  sec.appendChild(h);
  const body = el("div", "job-body");
  if (job.environment) body.appendChild(envTable(job.environment));

  const cases = (job.cases || []).slice().sort((a, b) => (order[a.result] ?? 9) - (order[b.result] ?? 9));
  if (cases.length) { for (const c of cases) body.appendChild(caseCard(c)); }
  else body.appendChild(el("div", "empty", "no cases recorded"));

  if (job.diagnostics && job.diagnostics.length) {
    const dg = el("details", "block"); dg.appendChild(el("summary", null, `run-level diagnostics — unattributed to any case (${job.diagnostics.length}; per-case breadcrumbs are on each case)`));
    for (const d of job.diagnostics) {
      const row = el("div", "diag");
      row.dataset.search = (d.severity + " " + d.name + " " + d.message).toLowerCase();
      row.innerHTML = `<span class="sev ${d.severity}">${d.severity || d.kind}</span>${d.name} ${d.message}`;
      dg.appendChild(row);
    }
    body.appendChild(dg);
  }
  if (job.cuda) { const cu = el("details", "block"); cu.appendChild(el("summary", null, "CUDA diagnostics")); cu.appendChild(el("pre", null, pretty(job.cuda))); body.appendChild(cu); }
  for (const [name, log] of Object.entries(job.logs || {})) body.appendChild(logBlock(name, log));

  sec.appendChild(body);
  return sec;
}

function render(run) {
  headStatus(run);
  const report = document.getElementById("report");
  report.innerHTML = "";
  if (!run.jobs || !run.jobs.length) { report.appendChild(el("div", "empty", "no job artifacts found")); }
  else for (const job of run.jobs) report.appendChild(jobSection(job));
  document.getElementById("raw-json").textContent = pretty(run);
}

function applyFilter(q) {
  q = q.trim().toLowerCase();
  for (const node of document.querySelectorAll("[data-search]")) {
    const hit = !q || node.dataset.search.includes(q);
    node.classList.toggle("hidden", !hit);
    if (hit && q && node.tagName === "DETAILS") node.open = true;
  }
}

render(data);
document.getElementById("search").addEventListener("input", (e) => applyFilter(e.target.value));
</script>
</body>
</html>
