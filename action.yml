name: "Notch-Comfy conformance"
description: "Verify the notch_comfy_client C++ interface conforms to the ComfyUI-Notch extension protocol, in a Docker container"

inputs:
  mode:
    description: "Conformance phase. extension_boot starts ComfyUI, verifies /object_info and /features, and compiles the C++ client interface. protocol_negotiation runs the discovery + transport-negotiation + readiness-decision cases. execution_delivery runs the inject/execute/delivery cases and file-availability enforcement."
    required: false
    default: "extension_boot"
  comfyui_repository:
    description: "ComfyUI git repository URL."
    required: false
    default: "https://github.com/comfyanonymous/ComfyUI.git"
  comfyui_ref:
    description: "ComfyUI tag, branch, or commit. Pin this to a release tag or commit for reproducible runs."
    required: false
    default: "v0.23.0"
  extension_repository:
    description: "Optional ComfyUI-Notch git repository URL. Empty means use the caller workspace checkout."
    required: false
    default: ""
  extension_ref:
    description: "Optional ComfyUI-Notch tag, branch, or commit when extension_repository is set."
    required: false
    default: ""
  listen_address:
    description: "ComfyUI listen address inside the container. The check client polls this same address."
    required: false
    default: "127.0.0.1"
  port:
    description: "ComfyUI HTTP port inside the container."
    required: false
    default: "8188"
  timeout:
    description: "Seconds to wait for the ComfyUI server to become reachable."
    required: false
    default: "180"
  comfyui_flags:
    description: "Flags passed to ComfyUI main.py."
    required: false
    default: "--disable-auto-launch"
  torch_index_url:
    description: "PyTorch pip index URL used inside the container."
    required: false
    default: "https://download.pytorch.org/whl/cu130"
  install_torch:
    description: "Install torch/torchvision/torchaudio before ComfyUI requirements."
    required: false
    default: "true"
  use_gpu:
    description: "Docker GPU mode: true, false, or auto. auto probes whether docker can run the image with --gpus all."
    required: false
    default: "auto"
  docker_image:
    description: "Local Docker image tag for the contract runner."
    required: false
    default: "notch-contract-ci:local"
  docker_no_cache:
    description: "Build the Docker image with --no-cache."
    required: false
    default: "false"
  artifact_dir:
    description: "Directory under the caller workspace where run artifacts are written."
    required: false
    default: "notch-contract-artifacts"
  pip_cache_dir:
    description: "Simple path under the self-hosted runner workspace, mounted as /cache/pip and shared across both jobs so downloaded wheels are reused. Persists between runs (not cleaned)."
    required: false
    default: "notch-contract-pip-cache"
  upload_artifacts:
    description: "Upload artifact_dir with actions/upload-artifact."
    required: false
    default: "true"
  expected_node_classes:
    description: "Comma-separated Notch node classes expected in /object_info."
    required: false
    # SpoutReceiver is Windows-only; Docker extension initialization runs on Linux and checks the cross-platform nodes.
    default: "NotchSingleInput,NotchOutputNode"

runs:
  using: "composite"
  steps:
    - name: "[Docker] Prepare artifact directory"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $artifactRel = "${{ inputs.artifact_dir }}"
        if ([string]::IsNullOrWhiteSpace($artifactRel) -or $artifactRel -eq "." -or $artifactRel -eq ".." -or [System.IO.Path]::IsPathRooted($artifactRel) -or $artifactRel.Contains("..") -or $artifactRel.Contains("\") -or $artifactRel.Contains(":")) {
          Write-Error "artifact_dir must be a simple path under GITHUB_WORKSPACE: $artifactRel"
          exit 2
        }
        $artifactPath = Join-Path $env:GITHUB_WORKSPACE $artifactRel
        if (Test-Path -LiteralPath $artifactPath) {
          Remove-Item -LiteralPath $artifactPath -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null

    - name: "[Docker] Prepare shared pip cache directory"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $pipCacheRel = "${{ inputs.pip_cache_dir }}"
        if ([string]::IsNullOrWhiteSpace($pipCacheRel) -or $pipCacheRel -eq "." -or $pipCacheRel -eq ".." -or [System.IO.Path]::IsPathRooted($pipCacheRel) -or $pipCacheRel.Contains("..") -or $pipCacheRel.Contains("\") -or $pipCacheRel.Contains(":")) {
          Write-Error "pip_cache_dir must be a simple path under the runner workspace: $pipCacheRel"
          exit 2
        }
        # RUNNER_WORKSPACE persists across both jobs and between runs on a
        # self-hosted runner, and sits outside the per-run-cleaned checkout.
        $pipCachePath = Join-Path $env:RUNNER_WORKSPACE $pipCacheRel
        New-Item -ItemType Directory -Force -Path $pipCachePath | Out-Null
        Write-Host "Shared pip cache: $pipCachePath -> /cache/pip"

    - name: "[Docker] Build contract runner image"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $dockerArgs = @("build")
        if ("${{ inputs.docker_no_cache }}" -eq "true") {
          $dockerArgs += "--no-cache"
        }
        $dockerArgs += @("-t", "${{ inputs.docker_image }}", "${{ github.action_path }}")
        & docker @dockerArgs
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: "[Docker] Run Notch contract checks"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $artifactHost = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.artifact_dir }}"
        $pipCacheHost = Join-Path $env:RUNNER_WORKSPACE "${{ inputs.pip_cache_dir }}"
        $gpuArgs = @()

        if ("${{ inputs.use_gpu }}" -eq "true") {
          $gpuArgs = @("--gpus", "all")
        }
        elseif ("${{ inputs.use_gpu }}" -eq "auto") {
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            & docker run --rm --gpus all --entrypoint nvidia-smi "${{ inputs.docker_image }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $gpuArgs = @("--gpus", "all")
              Write-Host "Docker GPU probe passed; running with --gpus all."
            }
            else {
              Write-Host "Docker GPU probe failed; running without --gpus all."
            }
          }
          else {
            Write-Host "nvidia-smi not found on host; running without --gpus all."
          }
        }
        elseif ("${{ inputs.use_gpu }}" -ne "false") {
          Write-Error "Unsupported use_gpu value: ${{ inputs.use_gpu }}"
          exit 2
        }

        $actionPath = "${{ github.action_path }}"
        $dockerArgs = @(
          "run", "--rm"
        ) + $gpuArgs + @(
          "-e", "GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY",
          "-e", "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
          "-e", "GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
          "-e", "GITHUB_REF_NAME=$env:GITHUB_REF_NAME",
          "-v", "$($env:GITHUB_WORKSPACE):/workspace",
          "-v", "$($actionPath):/action:ro",
          "-v", "$($artifactHost):/artifacts",
          "-v", "$($pipCacheHost):/cache/pip",
          "${{ inputs.docker_image }}",
          "--mode", "${{ inputs.mode }}",
          "--comfyui-repository", "${{ inputs.comfyui_repository }}",
          "--comfyui-ref", "${{ inputs.comfyui_ref }}",
          "--extension-repository", "${{ inputs.extension_repository }}",
          "--extension-ref", "${{ inputs.extension_ref }}",
          "--workspace", "/workspace",
          "--artifacts", "/artifacts",
          "--host", "${{ inputs.listen_address }}",
          "--port", "${{ inputs.port }}",
          "--timeout", "${{ inputs.timeout }}",
          "--comfyui-flags=${{ inputs.comfyui_flags }}",
          "--torch-index-url", "${{ inputs.torch_index_url }}",
          "--install-torch", "${{ inputs.install_torch }}",
          "--expected-node-classes", "${{ inputs.expected_node_classes }}"
        )
        & docker @dockerArgs
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: "[Docker] Upload contract artifacts"
      if: ${{ inputs.upload_artifacts == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: notch-contract-${{ inputs.mode }}-${{ github.run_id }}
        path: ${{ github.workspace }}/${{ inputs.artifact_dir }}
