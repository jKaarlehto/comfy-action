name: "Notch-Comfy conformance"
description: "Verify the notch_comfy_client C++ interface conforms to the ComfyUI-Notch extension protocol, in a Docker container"

inputs:
  mode:
    description: "Conformance phase. extension_boot starts ComfyUI, verifies /object_info and /features, and compiles the C++ client interface. protocol_negotiation runs discovery + transport-negotiation + readiness. delivery_local runs local disk/http/cuda delivery. delivery_remote runs a two-container remote HTTP, named-route disk, and reachability delivery check."
    required: false
    default: "extension_boot"
  comfyui_repository:
    description: "ComfyUI git repository URL."
    required: false
    default: "https://github.com/comfyanonymous/ComfyUI.git"
  comfyui_ref:
    description: "ComfyUI tag, branch, or commit. Pin this to a release tag or commit for reproducible runs."
    required: false
    default: "v0.23.0"
  extension_repository:
    description: "Optional ComfyUI-Notch git repository URL. Empty means use the caller workspace checkout."
    required: false
    default: ""
  extension_ref:
    description: "Optional ComfyUI-Notch tag, branch, or commit when extension_repository is set."
    required: false
    default: ""
  listen_address:
    description: "ComfyUI listen address inside the container. The check client polls this same address."
    required: false
    default: "127.0.0.1"
  port:
    description: "ComfyUI HTTP port inside the container."
    required: false
    default: "8188"
  timeout:
    description: "Seconds to wait for the ComfyUI server to become reachable."
    required: false
    default: "180"
  comfyui_flags:
    description: "Flags passed to ComfyUI main.py."
    required: false
    default: "--disable-auto-launch"
  torch_index_url:
    description: "PyTorch package index URL used inside the container."
    required: false
    default: "https://download.pytorch.org/whl/cu130"
  install_torch:
    description: "Ensure torch/torchvision/torchaudio are installed before ComfyUI requirements."
    required: false
    default: "true"
  use_gpu:
    description: "Docker GPU mode: true, false, or auto. auto probes whether docker can run the image with --gpus all."
    required: false
    default: "auto"
  docker_image:
    description: "Local Docker image tag for the contract runner."
    required: false
    default: "notch-contract-ci:local"
  docker_no_cache:
    description: "Build the Docker image with --no-cache."
    required: false
    default: "false"
  artifact_dir:
    description: "Directory under the caller workspace where run artifacts are written."
    required: false
    default: "notch-contract-artifacts"
  uv_cache_dir:
    description: "Simple path under the self-hosted runner workspace, mounted as /cache/uv and shared across jobs so downloaded wheels are reused. Persists between runs (not cleaned)."
    required: false
    default: "notch-contract-uv-cache"
  upload_artifacts:
    description: "Upload artifact_dir with actions/upload-artifact."
    required: false
    default: "true"
  expected_node_classes:
    description: "Comma-separated Notch node classes expected in /object_info."
    required: false
    # SpoutReceiver is Windows-only; Docker extension initialization runs on Linux and checks the cross-platform nodes.
    default: "NotchSingleInput,NotchOutputNode"

runs:
  using: "composite"
  steps:
    - name: "[Docker] Prepare artifact directory"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $artifactRel = "${{ inputs.artifact_dir }}"
        if ([string]::IsNullOrWhiteSpace($artifactRel) -or $artifactRel -eq "." -or $artifactRel -eq ".." -or [System.IO.Path]::IsPathRooted($artifactRel) -or $artifactRel.Contains("..") -or $artifactRel.Contains("\") -or $artifactRel.Contains(":")) {
          Write-Error "artifact_dir must be a simple path under GITHUB_WORKSPACE: $artifactRel"
          exit 2
        }
        $artifactPath = Join-Path $env:GITHUB_WORKSPACE $artifactRel
        if (Test-Path -LiteralPath $artifactPath) {
          Remove-Item -LiteralPath $artifactPath -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null

    - name: "[Docker] Prepare shared uv cache directory"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $uvCacheRel = "${{ inputs.uv_cache_dir }}"
        if ([string]::IsNullOrWhiteSpace($uvCacheRel) -or $uvCacheRel -eq "." -or $uvCacheRel -eq ".." -or [System.IO.Path]::IsPathRooted($uvCacheRel) -or $uvCacheRel.Contains("..") -or $uvCacheRel.Contains("\") -or $uvCacheRel.Contains(":")) {
          Write-Error "uv_cache_dir must be a simple path under the runner workspace: $uvCacheRel"
          exit 2
        }
        # RUNNER_WORKSPACE persists across both jobs and between runs on a
        # self-hosted runner, and sits outside the per-run-cleaned checkout.
        $uvCachePath = Join-Path $env:RUNNER_WORKSPACE $uvCacheRel
        New-Item -ItemType Directory -Force -Path $uvCachePath | Out-Null
        Write-Host "Shared uv cache: $uvCachePath -> /cache/uv"

    - name: "[Docker] Build contract runner image"
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $env:DOCKER_BUILDKIT = "1"
        $dockerArgs = @("build")
        if ("${{ inputs.docker_no_cache }}" -eq "true") {
          $dockerArgs += "--no-cache"
        }
        $dockerArgs += @("--build-arg", "TORCH_INDEX_URL=${{ inputs.torch_index_url }}")
        $dockerArgs += @("-t", "${{ inputs.docker_image }}", "${{ github.action_path }}")
        & docker @dockerArgs
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: "[Docker] Run Notch contract checks"
      if: ${{ inputs.mode != 'delivery_remote' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $artifactHost = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.artifact_dir }}"
        $uvCacheHost = Join-Path $env:RUNNER_WORKSPACE "${{ inputs.uv_cache_dir }}"
        $gpuArgs = @()

        if ("${{ inputs.use_gpu }}" -eq "true") {
          $gpuArgs = @("--gpus", "all")
        }
        elseif ("${{ inputs.use_gpu }}" -eq "auto") {
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            & docker run --rm --gpus all --entrypoint nvidia-smi "${{ inputs.docker_image }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $gpuArgs = @("--gpus", "all")
              Write-Host "Docker GPU probe passed; running with --gpus all."
            }
            else {
              Write-Host "Docker GPU probe failed; running without --gpus all."
            }
          }
          else {
            Write-Host "nvidia-smi not found on host; running without --gpus all."
          }
        }
        elseif ("${{ inputs.use_gpu }}" -ne "false") {
          Write-Error "Unsupported use_gpu value: ${{ inputs.use_gpu }}"
          exit 2
        }

        $actionPath = "${{ github.action_path }}"
        # CUDA IPC on Docker Desktop / WSL2 GPU-PV is sensitive enough that the
        # action runs local delivery with the strictest namespace sharing we can
        # reasonably ask Docker for. These flags are diagnostics hygiene, not a
        # guarantee that cudaIpcOpenMemHandle works on the platform; the in-job
        # CUDA IPC probe and the CUDA delivery case record the actual behavior.
        #   --ipc=host      host IPC (POSIX/SysV shm), not Docker's 64MiB private shm
        #   --pid=host      host PID namespace, useful evidence for driver reports
        #   --cgroupns=host avoid private cgroup view hiding runtime/device facts
        if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
          & nvidia-smi *> (Join-Path $artifactHost "host-nvidia-smi.txt")
        }
        # Capture the host (WSL2) PID-1 IPC + cgroup namespace inodes so the
        # container can assert it actually shares them (--ipc=host / --cgroupns=host).
        # If a future edit drops a flag, the container's inode won't match the host's
        # and the job flags the degradation instead of silently breaking CUDA IPC.
        $hostIpcNs = ""
        $hostCgroupNs = ""
        try {
          $nsOut = & docker run --rm --pid=host --entrypoint sh "${{ inputs.docker_image }}" -c "readlink /proc/1/ns/ipc; readlink /proc/1/ns/cgroup" 2>$null
          if ($LASTEXITCODE -eq 0 -and $nsOut.Count -ge 2) {
            $hostIpcNs = $nsOut[0].Trim()
            $hostCgroupNs = $nsOut[1].Trim()
            @{ ipc = $hostIpcNs; cgroup = $hostCgroupNs } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactHost "host-namespaces.json")
          }
        } catch {}
        $dockerArgs = @(
          "run", "--rm",
          "--ipc=host", "--pid=host", "--cgroupns=host",
          "-e", "EXPECT_IPC_HOST=1",
          "-e", "EXPECT_CGROUPNS_HOST=1",
          "-e", "HOST_IPC_NS=$hostIpcNs",
          "-e", "HOST_CGROUP_NS=$hostCgroupNs"
        ) + $gpuArgs + @(
          "-e", "GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY",
          "-e", "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
          "-e", "GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
          "-e", "GITHUB_REF_NAME=$env:GITHUB_REF_NAME",
          "-v", "$($env:GITHUB_WORKSPACE):/workspace",
          "-v", "$($actionPath):/action:ro",
          "-v", "$($artifactHost):/artifacts",
          "-v", "$($uvCacheHost):/cache/uv",
          "${{ inputs.docker_image }}",
          "--mode", "${{ inputs.mode }}",
          "--comfyui-repository", "${{ inputs.comfyui_repository }}",
          "--comfyui-ref", "${{ inputs.comfyui_ref }}",
          "--extension-repository", "${{ inputs.extension_repository }}",
          "--extension-ref", "${{ inputs.extension_ref }}",
          "--workspace", "/workspace",
          "--artifacts", "/artifacts",
          "--host", "${{ inputs.listen_address }}",
          "--port", "${{ inputs.port }}",
          "--timeout", "${{ inputs.timeout }}",
          "--comfyui-flags=${{ inputs.comfyui_flags }}",
          "--torch-index-url", "${{ inputs.torch_index_url }}",
          "--install-torch", "${{ inputs.install_torch }}",
          "--expected-node-classes", "${{ inputs.expected_node_classes }}"
        )
        & docker @dockerArgs
        $dockerExit = $LASTEXITCODE
        foreach ($summary in @((Join-Path $artifactHost "conformance-summary.md"), (Join-Path $artifactHost "cuda-summary.md"))) {
          if ((Test-Path -LiteralPath $summary) -and $env:GITHUB_STEP_SUMMARY) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
        }
        if ($dockerExit -ne 0) {
          exit $dockerExit
        }

    - name: "[Docker] Run remote delivery topology"
      if: ${{ inputs.mode == 'delivery_remote' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $artifactHost = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.artifact_dir }}"
        $uvCacheHost = Join-Path $env:RUNNER_WORKSPACE "${{ inputs.uv_cache_dir }}"
        $gpuArgs = @()

        if ("${{ inputs.use_gpu }}" -eq "true") {
          $gpuArgs = @("--gpus", "all")
        }
        elseif ("${{ inputs.use_gpu }}" -eq "auto") {
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            & docker run --rm --gpus all --entrypoint nvidia-smi "${{ inputs.docker_image }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $gpuArgs = @("--gpus", "all")
              Write-Host "Docker GPU probe passed; running server with --gpus all."
            }
            else {
              Write-Host "Docker GPU probe failed; running server without --gpus all."
            }
          }
          else {
            Write-Host "nvidia-smi not found on host; running server without --gpus all."
          }
        }
        elseif ("${{ inputs.use_gpu }}" -ne "false") {
          Write-Error "Unsupported use_gpu value: ${{ inputs.use_gpu }}"
          exit 2
        }

        $actionPath = "${{ github.action_path }}"
        $networkName = "notch-contract-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $serverName = "$networkName-server"
        $serverArtifacts = Join-Path $artifactHost "server"
        $namedRouteId = "ci_shared_output"
        $namedRouteServerRoot = "/srv/notch-named-routes/$namedRouteId"
        $namedRouteClientRoot = "/mnt/notch-named-routes/$namedRouteId"
        $namedRouteRelativeDirectory = "remote-route"
        $namedRouteHost = Join-Path $artifactHost "named-routes"
        $namedRouteHostRoot = Join-Path $namedRouteHost $namedRouteId
        New-Item -ItemType Directory -Force -Path $serverArtifacts | Out-Null
        New-Item -ItemType Directory -Force -Path $namedRouteHostRoot | Out-Null

        if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
          & nvidia-smi *> (Join-Path $artifactHost "host-nvidia-smi.txt")
        }
        # Host (WSL2) PID-1 IPC + cgroup namespace inodes, so both containers can
        # assert they actually share them (--ipc=host / --cgroupns=host); a dropped
        # flag is then caught in-job rather than as a silent CUDA IPC failure.
        $hostIpcNs = ""
        $hostCgroupNs = ""
        try {
          $nsOut = & docker run --rm --pid=host --entrypoint sh "${{ inputs.docker_image }}" -c "readlink /proc/1/ns/ipc; readlink /proc/1/ns/cgroup" 2>$null
          if ($LASTEXITCODE -eq 0 -and $nsOut.Count -ge 2) {
            $hostIpcNs = $nsOut[0].Trim()
            $hostCgroupNs = $nsOut[1].Trim()
            @{ ipc = $hostIpcNs; cgroup = $hostCgroupNs } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactHost "host-namespaces.json")
          }
        } catch {}

        & docker network create $networkName
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        try {
          $serverArgs = @(
            "run", "-d",
            "--name", $serverName,
            "--network", $networkName,
            "--ipc=host", "--cgroupns=host",
            "-e", "EXPECT_IPC_HOST=1",
            "-e", "EXPECT_CGROUPNS_HOST=1",
            "-e", "HOST_IPC_NS=$hostIpcNs",
            "-e", "HOST_CGROUP_NS=$hostCgroupNs"
          ) + $gpuArgs + @(
            "-e", "GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY",
            "-e", "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            "-e", "GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
            "-e", "GITHUB_REF_NAME=$env:GITHUB_REF_NAME",
            "-v", "$($env:GITHUB_WORKSPACE):/workspace:ro",
            "-v", "$($actionPath):/action:ro",
            "-v", "$($artifactHost):/artifacts",
            "-v", "$($uvCacheHost):/cache/uv",
            "-v", "$($namedRouteHostRoot):$namedRouteServerRoot",
            "${{ inputs.docker_image }}",
            "--mode", "delivery_remote_server",
            "--comfyui-repository", "${{ inputs.comfyui_repository }}",
            "--comfyui-ref", "${{ inputs.comfyui_ref }}",
            "--extension-repository", "${{ inputs.extension_repository }}",
            "--extension-ref", "${{ inputs.extension_ref }}",
            "--workspace", "/workspace",
            "--artifacts", "/artifacts/server",
            "--host", "0.0.0.0",
            "--port", "${{ inputs.port }}",
            "--timeout", "${{ inputs.timeout }}",
            "--comfyui-flags=${{ inputs.comfyui_flags }}",
            "--torch-index-url", "${{ inputs.torch_index_url }}",
            "--install-torch", "${{ inputs.install_torch }}",
            "--expected-node-classes", "${{ inputs.expected_node_classes }}",
            "--named-route-id", $namedRouteId,
            "--named-route-server-root", $namedRouteServerRoot,
            "--named-route-relative-directory", $namedRouteRelativeDirectory
          )
          & docker @serverArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $clientArgs = @(
            "run", "--rm",
            "--network", $networkName,
            "--ipc=host", "--cgroupns=host",
            "-e", "EXPECT_IPC_HOST=1",
            "-e", "EXPECT_CGROUPNS_HOST=1",
            "-e", "HOST_IPC_NS=$hostIpcNs",
            "-e", "HOST_CGROUP_NS=$hostCgroupNs",
            "-e", "GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY",
            "-e", "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            "-e", "GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
            "-e", "GITHUB_REF_NAME=$env:GITHUB_REF_NAME",
            "-v", "$($env:GITHUB_WORKSPACE):/workspace:ro",
            "-v", "$($actionPath):/action:ro",
            "-v", "$($artifactHost):/artifacts",
            "-v", "$($uvCacheHost):/cache/uv",
            "-v", "$($namedRouteHostRoot):$namedRouteClientRoot",
            "${{ inputs.docker_image }}",
            "--mode", "delivery_remote_client",
            "--comfyui-repository", "${{ inputs.comfyui_repository }}",
            "--comfyui-ref", "${{ inputs.comfyui_ref }}",
            "--extension-repository", "${{ inputs.extension_repository }}",
            "--extension-ref", "${{ inputs.extension_ref }}",
            "--workspace", "/workspace",
            "--artifacts", "/artifacts",
            "--host", $serverName,
            "--port", "${{ inputs.port }}",
            "--timeout", "${{ inputs.timeout }}",
            "--comfyui-flags=${{ inputs.comfyui_flags }}",
            "--torch-index-url", "${{ inputs.torch_index_url }}",
            "--install-torch", "${{ inputs.install_torch }}",
            "--expected-node-classes", "${{ inputs.expected_node_classes }}",
            "--named-route-id", $namedRouteId,
            "--named-route-client-root", $namedRouteClientRoot,
            "--named-route-relative-directory", $namedRouteRelativeDirectory
          )
          & docker @clientArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
        finally {
          $serverLog = Join-Path $serverArtifacts "docker-server.log"
          & docker logs $serverName *> $serverLog
          & docker rm -f $serverName *> $null
          & docker network rm $networkName *> $null
          foreach ($summary in @(
            (Join-Path $artifactHost "conformance-summary.md"),
            (Join-Path $serverArtifacts "cuda-summary.md"),
            (Join-Path $artifactHost "cuda-summary.md")
          )) {
            if ((Test-Path -LiteralPath $summary) -and $env:GITHUB_STEP_SUMMARY) {
              Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          }
        }

    - name: "[Docker] Upload contract artifacts"
      if: ${{ inputs.upload_artifacts == 'true' && always() }}
      uses: actions/upload-artifact@v6
      with:
        name: notch-contract-${{ inputs.mode }}-${{ github.run_id }}
        path: ${{ github.workspace }}/${{ inputs.artifact_dir }}
